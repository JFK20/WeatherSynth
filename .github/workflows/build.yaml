name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # A tag v1.2.3 builds as 1.2.3; every other build uses the version in
      # Directory.Build.props with a -ci.<run> suffix so it can never be
      # mistaken for a release.
      - name: Resolve package version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
            version="${base}-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version"

      - name: Restore
        run: dotnet restore WeatherSynth.sln

      - name: Build
        run: dotnet build WeatherSynth.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }} -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test WeatherSynth.sln -c Release --no-build --verbosity normal

      - name: Pack
        run: |
          for proj in src/WeatherSynth.Core/WeatherSynth.Core.csproj src/WeatherSynth.Data/WeatherSynth.Data.csproj; do
            dotnet pack "$proj" -c Release --no-build -o artifacts \
              -p:Version=${{ steps.version.outputs.version }} \
              -p:ContinuousIntegrationBuild=true \
              -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
          done

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*
          if-no-files-found: error

  publish:
    # Only a v* tag publishes. The build job's tests must have passed.
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write   # required: GitHub mints the OIDC token nuget.org trusts
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: artifacts

      # Trusted publishing: exchange the OIDC token for a temporary API key.
      # It is valid for one hour and each token buys exactly one key, so this
      # step belongs immediately before the push, never earlier in the job.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        env:
          VERSION: ${{ needs.build.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for id in WeatherSynth.Core WeatherSynth; do
            lower=$(echo "$id" | tr '[:upper:]' '[:lower:]')
            if curl -sfL -o /dev/null \
                "https://api.nuget.org/v3-flatcontainer/$lower/$VERSION/$lower.$VERSION.nupkg"; then
              echo "$id $VERSION is already on nuget.org - skipping"
              continue
            fi
            dotnet nuget push "artifacts/$id.$VERSION.nupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" --skip-duplicate
          done
